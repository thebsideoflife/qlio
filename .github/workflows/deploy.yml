name: Deploy backend

# main deploys production; dev deploys the dev environment.
on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'deploy.sh'
      - 'build-ffmpeg-layer.sh'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  TF_VAR_profile: zeevee
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Terraform/OpenTofu uses profile "zeevee" (hardcoded in backend config).
      # Create the profile from the env vars set by configure-aws-credentials.
      - name: Create zeevee AWS profile
        run: |
          mkdir -p ~/.aws
          cat >> ~/.aws/credentials <<'EOF'
          [zeevee]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          cat >> ~/.aws/config <<'EOF'
          [profile zeevee]
          region = us-west-2
          output = json
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Package render Lambda
        run: bash ./package-render.sh
        working-directory: backend

      - name: Restore cached FFmpeg layer
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: infrastructure/layers/ffmpeg-layer.zip
          key: ffmpeg-layer-${{ hashFiles('build-ffmpeg-layer.sh') }}

      - name: Build FFmpeg layer
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash ./build-ffmpeg-layer.sh

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.x

      - name: Init OpenTofu
        run: tofu init -input=false
        working-directory: infrastructure

      # Skip the FFmpeg image rebuild when its runtime inputs are unchanged.
      # Hash the lockfile (what `npm ci` installs), not package.json — a new
      # test script must not rebuild the stitch/split container.
      - name: Check FFmpeg image inputs
        id: ffmpeg-image
        uses: actions/cache@v4
        with:
          path: .ffmpeg-image-stamp
          # Per environment: each has its own ECR repo, so dev must not skip
          # its first image build because prod already built the same inputs.
          key: ffmpeg-image-${{ env.DEPLOY_ENV }}-${{ hashFiles('backend/Dockerfile.ffmpeg', 'backend/package-lock.json', 'backend/dist/cutSegments.js', 'backend/dist/splitVideo.js') }}

      - name: Record FFmpeg image stamp
        if: steps.ffmpeg-image.outputs.cache-hit != 'true'
        run: date -u +%Y-%m-%dT%H:%M:%SZ > .ffmpeg-image-stamp

      - name: Deploy
        run: |
          if [ "${{ steps.ffmpeg-image.outputs.cache-hit }}" = "true" ]; then
            echo "FFmpeg image inputs unchanged; skipping Docker rebuild"
            bash ./deploy.sh --env "$DEPLOY_ENV" --skip-docker
          else
            echo "FFmpeg image inputs changed; rebuilding Docker image"
            bash ./deploy.sh --env "$DEPLOY_ENV"
          fi
