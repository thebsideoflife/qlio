name: Deploy backend

# Runs on a push to main (debounced: a burst of pushes deploys once, from the
# newest commit) or from the Actions tab. Local equivalent: ./deploy.sh with the
# `zeevee` AWS profile (docs/DEPLOY.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'deploy.sh'
      - 'build-ffmpeg-layer.sh'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  TF_VAR_profile: zeevee

jobs:
  debounce:
    # Coalesce a burst of pushes to main. Wait two minutes, then continue only
    # if this commit is still the tip of main; otherwise a newer push has its
    # own run (which also cancels this one via `concurrency`), and that run
    # deploys. Manual runs never wait.
    name: Debounce
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Wait, then skip unless still the tip of main
        id: check
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 120
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$tip" == "${GITHUB_SHA}" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::main moved on to ${tip:0:12}; the run for that commit deploys it."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: debounce
    if: needs.debounce.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Terraform/OpenTofu uses profile "zeevee" (hardcoded in backend config).
      # Create the profile from the env vars set by configure-aws-credentials.
      - name: Create zeevee AWS profile
        run: |
          mkdir -p ~/.aws
          cat >> ~/.aws/credentials <<'EOF'
          [zeevee]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          cat >> ~/.aws/config <<'EOF'
          [profile zeevee]
          region = us-west-2
          output = json
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Package render Lambda
        run: bash ./package-render.sh
        working-directory: backend

      - name: Restore cached FFmpeg layer
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: infrastructure/layers/ffmpeg-layer.zip
          key: ffmpeg-layer-${{ hashFiles('build-ffmpeg-layer.sh') }}

      - name: Build FFmpeg layer
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash ./build-ffmpeg-layer.sh

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.x

      - name: Init OpenTofu
        run: tofu init -input=false
        working-directory: infrastructure

      # Skip the FFmpeg image rebuild when its runtime inputs are unchanged.
      # Hash the lockfile (what `npm ci` installs), not package.json — a new
      # test script must not rebuild the stitch/split container.
      - name: Check FFmpeg image inputs
        id: ffmpeg-image
        uses: actions/cache@v4
        with:
          path: .ffmpeg-image-stamp
          key: ffmpeg-image-${{ hashFiles('backend/Dockerfile.ffmpeg', 'backend/package-lock.json', 'backend/dist/cutSegments.js', 'backend/dist/splitVideo.js') }}

      - name: Record FFmpeg image stamp
        if: steps.ffmpeg-image.outputs.cache-hit != 'true'
        run: date -u +%Y-%m-%dT%H:%M:%SZ > .ffmpeg-image-stamp

      - name: Deploy
        run: |
          if [ "${{ steps.ffmpeg-image.outputs.cache-hit }}" = "true" ]; then
            echo "FFmpeg image inputs unchanged; skipping Docker rebuild"
            bash ./deploy.sh --skip-docker
          else
            echo "FFmpeg image inputs changed; rebuilding Docker image"
            bash ./deploy.sh
          fi
