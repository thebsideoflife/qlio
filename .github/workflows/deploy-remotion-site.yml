name: Deploy Remotion site

# Runs on a push to main (debounced: a burst of pushes deploys once, from the
# newest commit) or from the Actions tab. Local equivalent:
# cd zeevee && ./deploy-remotion-site.sh with the `zeevee` AWS profile (docs/DEPLOY.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "zeevee/src/remotion/**"
      - "zeevee/src/components/editor/CaptionText.tsx"
      - "zeevee/src/components/editor/CaptionDisplay.tsx"
      - "zeevee/src/components/editor/CaptionOverlay.tsx"
      - "zeevee/deploy-remotion-site.sh"
      - ".github/workflows/deploy-remotion-site.yml"

concurrency:
  group: deploy-remotion-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debounce:
    # Coalesce a burst of pushes to main. Wait two minutes, then continue only
    # if this commit is still the tip of main; otherwise a newer push has its
    # own run (which also cancels this one via `concurrency`), and that run
    # deploys. Manual runs never wait.
    name: Debounce
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Wait, then skip unless still the tip of main
        id: check
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 120
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$tip" == "${GITHUB_SHA}" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::main moved on to ${tip:0:12}; the run for that commit deploys it."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: debounce
    if: needs.debounce.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zeevee/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: zeevee

      - name: Publish Remotion site
        run: bash ./deploy-remotion-site.sh
        working-directory: zeevee
        env:
          AWS_REGION: us-west-2
