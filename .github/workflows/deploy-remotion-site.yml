name: Deploy Remotion site

on:
  push:
    branches: [main]
    paths:
      - "zeevee/src/remotion/**"
      - "zeevee/src/components/editor/CaptionText.tsx"
      - "zeevee/src/components/editor/CaptionDisplay.tsx"
      - "zeevee/src/components/editor/CaptionOverlay.tsx"
      - "zeevee/deploy-remotion-site.sh"
      - ".github/workflows/deploy-remotion-site.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zeevee/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: zeevee

      - name: Publish Remotion site
        run: bash ./deploy-remotion-site.sh
        working-directory: zeevee
        env:
          AWS_REGION: us-west-2
